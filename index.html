<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI SCOUT | Intelligence Sovereignty</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyan: '#00fff2', gold: '#ffcc00', dark: '#0a0a0a', obsidian: '#0f1115', panel: '#15181e',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { background-color: #0a0a0a; color: #ffffff; -webkit-font-smoothing: antialiased; margin: 0; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00fff2; }
        .mask-image-gradient { -webkit-mask-image: linear-gradient(to left, transparent, black); mask-image: linear-gradient(to left, transparent, black); }
        .report-card { transition: all 0.3s ease; }
        .report-card:hover { border-color: rgba(0, 255, 242, 0.5); transform: translateY(-4px); box-shadow: 0 8px 30px rgba(0, 255, 242, 0.1); }
        .modal-content { animation: slide-up 0.3s ease-out forwards; }
        @keyframes slide-up { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    </style>
</head>
<body class="flex h-screen w-full bg-dark overflow-hidden selection:bg-cyan/30 selection:text-cyan">

    <aside class="w-16 md:w-64 bg-obsidian border-r border-cyan/20 flex-col justify-between z-10 hidden sm:flex shrink-0">
        <div>
            <div class="p-6 border-b border-cyan/20 flex items-center md:gap-3">
                <i data-lucide="radio" class="text-cyan w-6 h-6 animate-pulse"></i>
                <span class="hidden md:block font-black text-cyan tracking-[0.2em] font-mono whitespace-nowrap overflow-hidden">AI SCOUT</span>
            </div>
            <nav class="p-4 space-y-2">
                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-md transition-all duration-200 group bg-cyan/10 text-cyan border border-cyan/20">
                    <i data-lucide="terminal" class="w-[18px] h-[18px]"></i>
                    <span class="hidden md:block font-mono text-xs font-bold tracking-widest">TERMINAL</span>
                </a>
            </nav>
        </div>
        <div class="p-6 border-t border-cyan/10">
            <div class="hidden md:flex items-center gap-2 text-xs font-mono text-zinc-500">
                <i data-lucide="lock" class="w-3 h-3 text-gold"></i>
                <span class="text-gold">ENC: 2048-RSA</span>
            </div>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto relative bg-dark">
        <header class="sticky top-0 z-20 bg-dark/80 backdrop-blur-md border-b border-white/5 py-4 px-6 md:px-10 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-2 h-2 rounded-full bg-cyan shadow-[0_0_8px_#00fff2] animate-pulse"></div>
                <span class="text-xs font-mono tracking-widest text-zinc-400">NETWORK: SECURE</span>
            </div>
            <div id="header-date" class="text-xs font-mono tracking-widest text-zinc-500">// INTEL_SYNC</div>
        </header>

        <div class="p-6 md:p-10 pb-24 max-w-7xl mx-auto">
            <div class="mb-12 relative overflow-hidden rounded-xl border border-cyan/30 bg-panel group">
                <div class="absolute inset-0 bg-gradient-to-r from-obsidian to-transparent z-10 pointer-events-none"></div>
                <div class="flex flex-col md:flex-row min-h-[300px]">
                    <div class="z-20 p-8 md:p-12 flex flex-col justify-center w-full md:w-1/2">
                        <h1 class="text-4xl md:text-5xl font-black text-white tracking-tight mb-2 uppercase">AI SCOUT INTEL</h1>
                        <p class="text-cyan font-mono text-sm uppercase tracking-widest mb-6 border-l-2 border-gold pl-3">Advanced Strategic Archives & Intelligence Operations Platform</p>
                    </div>
                    <div class="absolute right-0 top-0 bottom-0 w-full md:w-2/3 h-full opacity-40">
                        <img src="./hero_main.png" alt="Hero" class="w-full h-full object-cover">
                        <div class="absolute inset-0 mask-image-gradient bg-gradient-to-l from-transparent to-panel"></div>
                    </div>
                </div>
            </div>

            <div id="reports-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
        </div>
    </main>

    <div id="report-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 md:p-6 bg-dark/95 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
        <div class="modal-content bg-[#111111] border border-cyan/40 w-full max-w-4xl max-h-[90vh] overflow-y-auto rounded-xl shadow-[0_0_50px_rgba(0,255,242,0.15)] flex flex-col">
            <div class="sticky top-0 bg-[#111111]/95 backdrop-blur px-6 py-4 border-b border-white/10 flex justify-between items-center z-10">
                <h2 id="modal-title" class="text-lg md:text-xl font-bold text-white tracking-wide">Report</h2>
                <button id="close-modal-btn" class="text-zinc-500 hover:text-cyan p-2 cursor-pointer"><i data-lucide="x"></i></button>
            </div>

            <div class="p-6 md:p-8">
                <div class="flex flex-col md:flex-row gap-8">
                    <div class="flex-1 order-2 md:order-1">
                        <h3 class="text-gold font-mono text-xs tracking-widest mb-3 border-b border-gold/20 pb-2 uppercase">Intelligence Briefing</h3>
                        <div id="modal-description" class="text-zinc-300 leading-relaxed text-sm md:text-base whitespace-pre-wrap"></div>
                    </div>
                    
                    <div id="audio-container" class="w-full md:w-72 bg-dark border border-white/10 p-5 rounded flex flex-col h-fit order-1 md:order-2">
                        <div class="flex items-center gap-2 mb-4 text-cyan uppercase font-mono text-[10px] tracking-widest">
                            <i data-lucide="volume-2" class="w-4 h-4"></i> Audio Transmission
                        </div>
                        <div class="bg-obsidian border border-white/5 rounded p-3 mb-4 flex items-center justify-center h-16 relative overflow-hidden" id="audio-wave"></div>
                        <div class="flex flex-col gap-2">
                            <div class="flex justify-between text-[10px] font-mono text-zinc-500">
                                <span id="audio-current">00:00</span><span id="audio-total">00:00</span>
                            </div>
                            <div class="flex items-center gap-3">
                                <button id="play-pause-btn" class="w-10 h-10 flex items-center justify-center bg-cyan/20 hover:bg-cyan/40 text-cyan rounded-full transition-colors">
                                    <i data-lucide="play" id="icon-play" class="w-5 h-5 ml-0.5"></i>
                                    <i data-lucide="pause" id="icon-pause" class="w-5 h-5 hidden"></i>
                                </button>
                                <input type="range" id="audio-progress" value="0" class="w-full h-1 bg-white/20 rounded-lg appearance-none cursor-pointer accent-cyan">
                            </div>
                        </div>
                        <audio id="modal-audio" class="hidden"><source id="modal-audio-source" src="" type="audio/mpeg"></audio>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const intelData = {
            reports: [
                { id: 1, title: "Strategic Intel Report 01", description: "اكتب هنا نص المقال الأول الذي يرافق البودكاست...\nيمكنك استخدام أسطر جديدة لتنظيم النص.", image: "./hero1.png", audioUrl:"https://docs.google.com/uc?export=open&id=1tAIpprRdAkouSzD91RgziNxbByExpnqF" },
                { id: 2, title: "Operational Scout 02", description: "نص المقال الثاني الخاص بالبودكاست الثاني هنا.", image: "./hero2.png", audioUr1: "https://drive.google.com/uc?id=1SrgKMCYpWwrOq-ccLD70hOVGCS3hgxcf" },
                { id: 3, title: "Digital Surveillance 03", description: "هذا مقال فقط بدون بودكاست (لاحظ اختفاء المشغل).", image: "./hero3.png", audioUrl: "" }
            ]
        };

        function renderGrid() {
            const grid = document.getElementById('reports-grid');
            grid.innerHTML = intelData.reports.map(report => `
                <div class="report-card bg-panel border border-white/5 rounded-lg overflow-hidden group cursor-pointer" onclick="openModal(${report.id})">
                    <div class="h-40 bg-obsidian relative">
                        <img src="${report.image}" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity">
                        <div class="absolute top-3 right-3 bg-dark/80 text-gold font-mono text-[10px] px-2 py-1 rounded">ID: ${report.id.toString().padStart(3, '0')}</div>
                    </div>
                    <div class="p-5 font-mono">
                        <h3 class="text-cyan text-sm font-bold mb-2 uppercase">${report.title}</h3>
                        <p class="text-zinc-500 text-xs line-clamp-2">${report.description}</p>
                    </div>
                </div>
            `).join('');
        }

        window.openModal = (id) => {
            const report = intelData.reports.find(r => r.id === id);
            if(!report) return;
            document.getElementById('modal-title').innerText = report.title;
            document.getElementById('modal-description').innerText = report.description;
            const audioContainer = document.getElementById('audio-container');
            const modalAudio = document.getElementById('modal-audio');
            const modalAudioSource = document.getElementById('modal-audio-source');

            if (report.audioUrl) {
                audioContainer.classList.remove('hidden');
                modalAudioSource.src = report.audioUrl;
                modalAudio.load();
            } else {
                audioContainer.classList.add('hidden');
                modalAudio.pause();
            }

            const modal = document.getElementById('report-modal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.add('opacity-100'), 10);
        };

        document.getElementById('close-modal-btn').onclick = () => {
            const modal = document.getElementById('report-modal');
            modal.classList.remove('opacity-100');
            document.getElementById('modal-audio').pause();
            setTimeout(() => modal.classList.add('hidden'), 300);
        };

        // Audio Logic
        const audio = document.getElementById('modal-audio');
        const playBtn = document.getElementById('play-pause-btn');
        playBtn.onclick = () => audio.paused ? audio.play() : audio.pause();
        audio.onplay = () => { document.getElementById('icon-play').classList.add('hidden'); document.getElementById('icon-pause').classList.remove('hidden'); };
        audio.onpause = () => { document.getElementById('icon-play').classList.remove('hidden'); document.getElementById('icon-pause').classList.add('hidden'); };
        audio.ontimeupdate = () => {
            const progress = (audio.currentTime / audio.duration) * 100;
            document.getElementById('audio-progress').value = progress || 0;
            document.getElementById('audio-current').innerText = formatTime(audio.currentTime);
            document.getElementById('audio-total').innerText = formatTime(audio.duration);
        };
        const formatTime = (s) => isNaN(s) ? "00:00" : new Date(s * 1000).toISOString().substr(14, 5);

        document.addEventListener('DOMContentLoaded', () => {
            renderGrid();
            lucide.createIcons();
            const wave = document.getElementById('audio-wave');
            for(let i=0; i<15; i++) wave.innerHTML += `<div class="bg-cyan/40 w-1 mx-0.5 rounded-full" style="height:${Math.random()*40+10}px"></div>`;
        });
    </script>
</body>
</html>
