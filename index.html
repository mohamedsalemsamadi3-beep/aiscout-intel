<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI SCOUT | Intelligence Sovereignty</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { cyan: '#00fff2', gold: '#ffcc00', dark: '#0a0a0a', obsidian: '#0f1115', panel: '#15181e' },
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #0a0a0a; color: #ffffff; -webkit-font-smoothing: antialiased; }
        .report-card { transition: all 0.3s ease; border: 1px solid rgba(0, 255, 242, 0.1); }
        .report-card:hover { border-color: rgba(0, 255, 242, 0.5); transform: translateY(-4px); }
    </style>
</head>
<body class="flex h-screen w-full bg-dark overflow-hidden">

    <aside class="w-16 md:w-64 bg-obsidian border-r border-cyan/20 flex flex-col justify-between hidden sm:flex">
        <div>
            <div class="p-6 border-b border-cyan/20 flex items-center gap-3">
                <i data-lucide="radio" class="text-cyan w-6 h-6 animate-pulse"></i>
                <span class="hidden md:block font-black text-cyan tracking-widest font-mono">AI SCOUT</span>
            </div>
            <nav class="p-4 space-y-2">
                <div class="flex items-center gap-3 px-4 py-3 rounded bg-cyan/10 text-cyan border border-cyan/20">
                    <i data-lucide="terminal" class="w-4 h-4"></i>
                    <span class="hidden md:block font-mono text-[10px] font-bold tracking-widest">TERMINAL</span>
                </div>
            </nav>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto relative">
        <header class="sticky top-0 z-20 bg-dark/80 backdrop-blur-md border-b border-white/5 py-4 px-10 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-cyan shadow-[0_0_8px_#00fff2] animate-pulse"></div>
                <span class="text-[10px] font-mono tracking-widest text-zinc-400 uppercase">System Active</span>
            </div>
        </header>

        <div class="p-10 pb-24 max-w-7xl mx-auto">
            <div class="flex items-center gap-4 mb-8">
                <h2 class="text-2xl font-bold tracking-widest text-zinc-100 uppercase">Intelligence Feed</h2>
                <div class="flex-1 h-px bg-gradient-to-r from-cyan/50 to-transparent"></div>
            </div>

            <div id="reports-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                </div>
        </div>
    </main>

    <div id="report-modal" class="fixed inset-0 z-50 flex items-center justify-center p-6 bg-dark/95 backdrop-blur-sm hidden opacity-0 transition-all duration-300">
        <div class="bg-[#111111] border border-cyan/40 w-full max-w-2xl rounded-xl overflow-hidden shadow-2xl flex flex-col">
            <div class="px-6 py-4 border-b border-white/10 flex justify-between items-center">
                <h2 id="modal-title" class="text-lg font-bold text-white uppercase tracking-widest">Report</h2>
                <button id="close-modal-btn" class="text-zinc-500 hover:text-cyan transition-colors"><i data-lucide="x"></i></button>
            </div>
            <div class="p-8 flex flex-col md:flex-row gap-8">
                <div class="flex-1" dir="rtl">
                    <p id="modal-description" class="text-zinc-300 leading-relaxed text-sm text-right"></p>
                </div>
                <div id="audio-container" class="w-full md:w-48 bg-obsidian p-4 rounded border border-white/5 hidden">
                    <div class="flex flex-col gap-4">
                        <div class="flex justify-between text-[10px] font-mono text-cyan/70">
                            <span id="audio-current">00:00</span>
                            <span id="audio-total">00:00</span>
                        </div>
                        <button id="play-pause-btn" class="w-12 h-12 mx-auto flex items-center justify-center bg-cyan/20 text-cyan rounded-full border border-cyan/40">
                            <i data-lucide="play" id="icon-play" class="w-6 h-6 ml-1"></i>
                            <i data-lucide="pause" id="icon-pause" class="w-6 h-6 hidden"></i>
                        </button>
                        <input type="range" id="audio-progress" value="0" class="w-full h-1 bg-white/10 rounded appearance-none accent-cyan">
                    </div>
                    <audio id="modal-audio" preload="auto"></audio>
                </div>
            </div>
        </div>
    </div>

    <script>
        const intelData = {
            reports: [
                { 
                    id: 1, 
                    title: "Strategic Intel 01", 
                    description: "تم تحديث البودكاست بنجاح. هذا التقرير يحتوي على البيانات الصوتية المرفوعة مباشرة على الخادم لضمان أعلى سرعة تشغيل وأمان.", 
                    audioUrl: "./podcast1.mp3" 
                },
                { id: 2, title: "Operational Scout 02", description: "تقرير تكتيكي ميداني.", audioUrl: "" }
            ]
        };

        const renderGrid = () => {
            const grid = document.getElementById('reports-grid');
            grid.innerHTML = intelData.reports.map(r => `
                <div class="report-card bg-panel p-6 rounded-lg cursor-pointer group" onclick="openModal(${r.id})">
                    <div class="text-gold font-mono text-[10px] mb-2">ID: ${r.id.toString().padStart(3, '0')}</div>
                    <h3 class="text-cyan font-bold mb-3 uppercase tracking-tight">${r.title}</h3>
                    <p class="text-zinc-500 text-xs line-clamp-2" dir="rtl">${r.description}</p>
                    <div class="mt-4 pt-4 border-t border-white/5 text-[10px] text-cyan font-mono opacity-0 group-hover:opacity-100 transition-opacity">ACCESS_DATA ></div>
                </div>
            `).join('');
        };

        const audio = document.getElementById('modal-audio');
        const playPauseBtn = document.getElementById('play-pause-btn');

        window.openModal = (id) => {
            const r = intelData.reports.find(x => x.id === id);
            document.getElementById('modal-title').innerText = r.title;
            document.getElementById('modal-description').innerText = r.description;
            
            const container = document.getElementById('audio-container');
            if (r.audioUrl) {
                container.classList.remove('hidden');
                audio.src = r.audioUrl;
                audio.load();
            } else {
                container.classList.add('hidden');
            }

            const m = document.getElementById('report-modal');
            m.classList.remove('hidden');
            setTimeout(() => m.classList.replace('opacity-0', 'opacity-100'), 10);
        };

        playPauseBtn.onclick = () => {
            if (audio.paused) {
                audio.play();
                document.getElementById('icon-play').classList.add('hidden');
                document.getElementById('icon-pause').classList.remove('hidden');
            } else {
                audio.pause();
                document.getElementById('icon-play').classList.remove('hidden');
                document.getElementById('icon-pause').classList.add('hidden');
            }
        };

        audio.ontimeupdate = () => {
            const progress = (audio.currentTime / audio.duration) * 100;
            document.getElementById('audio-progress').value = progress || 0;
            document.getElementById('audio-current').innerText = formatTime(audio.currentTime);
            document.getElementById('audio-total').innerText = formatTime(audio.duration);
        };

        const formatTime = (s) => {
            if (isNaN(s)) return "00:00";
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        };

        document.getElementById('close-modal-btn').onclick = () => {
            const m = document.getElementById('report-modal');
            m.classList.replace('opacity-100', 'opacity-0');
            audio.pause();
            setTimeout(() => m.classList.add('hidden'), 300);
        };

        document.addEventListener('DOMContentLoaded', () => {
            renderGrid();
            lucide.createIcons();
        });
    </script>
</body>
</html>
